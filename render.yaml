services:
  - type: web
    name: mrixdu-escrow-bot
    env: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: ADMIN_IDS
        sync: false
      - key: DB_PATH
        value: /opt/render/project/src/data/escrow.db
    disk:
      name: data
      mountPath: /opt/render/project/src/data
      sizeGB: 1
